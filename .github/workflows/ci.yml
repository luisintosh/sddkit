name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n (syntax) on every shell script
        run: |
          set -e
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 bash -n
      - name: shellcheck
        run: |
          set -e
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 shellcheck

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build both harness install trees
        run: bun run build
      - name: Hygiene checks (frontmatter, opencode.jsonc, README drift, built-tree manifest integrity)
        run: node scripts/check.mjs

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test core/ adapters/ build/

  e2e-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bash test/e2e-install.sh
