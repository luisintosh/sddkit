# Per-agent metadata for OpenCode and Cursor emitters. Bodies live in prompts/agents/.
#
# Permission maps: opencode applies the LAST matching pattern, so order is
# load-bearing — broad rules first, narrow exceptions last. Reordering a block
# silently changes what an agent may edit.

agents:
  sddkit:
    description: >-
      Drives the end-to-end spec-driven development (SDD) feature pipeline — sequences stages, manages human-in-the-loop
      gates, routes review findings, keeps docs in sync. Use when the user asks to implement a feature, run SDD, or
      resume/continue a pipeline. Treats a normal feature request as a request to run the full workflow.
    opencode:
      mode: primary
      model: opencode-go/qwen3.7-plus
      temperature: 0.2
      steps: 100
      permission:
        edit:
          "docs/feats/**/state.yaml": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
    cursor:
      model: inherit
      skill: true

  spec:
    description: >-
      Writes feature specifications (the what & why) and spec-derived acceptance contracts. Use when the conductor
      delegates specify/contracts, or when a spec or its @S<n> scenarios must be written or revised.
    opencode:
      mode: subagent
      model: openai/gpt-5.6-sol
      temperature: 0.3
      steps: 20
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
        bash: deny
    cursor:
      model: grok-4.5

  architect:
    description: >-
      Plans implementation strategy and writes feature plans (SDD plan stage). Owns codebase exploration. Use when the
      conductor delegates plan, or when a feature plan and its Slices section must be written or revised.
    opencode:
      mode: subagent
      model: openai/gpt-5.6-sol
      temperature: 0.3
      steps: 30
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
        bash: allow
    cursor:
      model: grok-4.5

  plan-reviewer:
    description: >-
      Independent, READ-ONLY critique of the spec or the plan before its gate. Emits structured spec/plan findings;
      never edits. Use when the conductor delegates a spec or plan critique.
    opencode:
      mode: subagent
      model: opencode-go/kimi-k3
      temperature: 0.1
      steps: 25
      permission:
        edit: deny
        write: deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor:
      model: kimi-k3
      readonly: true

  tester:
    description: >-
      TDD red phase. Writes failing tests from acceptance contracts. Edits test-only locations — never implementation,
      never the contracts. Use when the conductor delegates the red phase of a slice.
    opencode:
      mode: subagent
      model: opencode-go/kimi-k2.7-code
      temperature: 0.2
      steps: 40
      permission:
        edit:
          "*": deny
          "**/*.test.*": allow
          "**/*.spec.*": allow
          "**/*_test.*": allow
          "**/test_*.*": allow
          "**/__tests__/**": allow
          "**/tests/**": allow
          "**/test/**": allow
          "**/spec/**": allow
          "e2e/**": allow
          "**/*.feature": allow
          # Must stay last: acceptance contracts are .feature files, and only
          # the trailing position keeps this deny ahead of the allow above.
          "docs/feats/**": deny
    cursor:
      model: kimi-k2.7-code

  implementer:
    description: >-
      TDD green phase. Writes the minimal implementation to make failing tests pass. Never edits test files. Use when
      the conductor delegates green, an escalation re-derive, or a targeted-test fix.
    opencode:
      mode: subagent
      model: openai/gpt-5.6-luna
      temperature: 0.2
      steps: 40
      permission:
        edit:
          "*": allow
          "**/*.test.*": deny
          "**/*.spec.*": deny
          "**/*_test.*": deny
          "**/test_*.*": deny
          "**/__tests__/**": deny
          "**/tests/**": deny
          "**/test/**": deny
          "**/spec/**": deny
          "e2e/**": deny
          # Frozen inputs to a slice: spec, plan, contracts.
          "docs/feats/**": deny
          "**/*.feature": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
    cursor:
      model: composer-2.5

  code-reviewer:
    description: >-
      Independent, READ-ONLY review of the active slice's diff against its acceptance contracts. Emits structured
      findings; never edits. Use when the conductor delegates slice review (contract, health, or all lenses).
    opencode:
      mode: subagent
      model: opencode-go/kimi-k2.7-code
      temperature: 0.1
      steps: 25
      permission:
        edit: deny
        write: deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor:
      model: kimi-k2.7-code
      readonly: true

  qa:
    description: >-
      Validates the implementation against spec + acceptance contracts. Playwright for UI; non-UI validation menu
      otherwise. Posts the evidence report as a PR comment. Use when the conductor delegates QA.
    opencode:
      mode: subagent
      model: opencode-go/deepseek-v4-pro
      temperature: 0.1
      steps: 60
      permission:
        edit:
          "*": deny
          "/tmp/**": allow
        bash: allow
    cursor:
      model: composer-2.5

  docs-writer:
    description: >-
      Writes the human-facing docs a finished feature leaves behind — the owning domain's README, plus AGENTS.md and
      docs/ARCHITECTURE.md. Current state only, never a changelog. Use when the conductor delegates docs-sync.
    opencode:
      mode: subagent
      model: opencode-go/kimi-k3
      temperature: 0.1
      steps: 30
      permission:
        edit:
          "*": deny
          "AGENTS.md": allow
          "docs/**": allow
          "**/README.md": allow
          # Must stay last: the root README is the project's own and
          # docs/feats/** is the conductor's, and only the trailing position
          # keeps these denies ahead of the allows above.
          "README.md": deny
          "docs/feats/**": deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor:
      model: kimi-k3

  sddkit-plan:
    description: >-
      Product Owner planner. Refines a raw idea into a measurable goal, then writes a feature roadmap at
      docs/product/<slug>/roadmap.md. Use when the user asks to plan a product, write a roadmap, or turn an idea into
      sequenced features. Standalone — does not run the SDD pipeline.
    opencode:
      mode: primary
      model: openai/gpt-5.6-sol
      temperature: 0.4
      steps: 80
      permission:
        edit:
          "*": deny
          "docs/product/**": allow
          "/tmp/**": allow
        bash:
          "*": ask
          "git status*": allow
          "git branch*": allow
          "git remote*": allow
          "git rev-parse*": allow
          "git log*": allow
          "git add docs/product*": allow
          "git commit*": allow
          "gh auth status*": allow
          "gh repo view*": allow
          "gh issue create*": allow
          "gh issue view*": allow
          "gh issue list*": allow
    cursor:
      model: inherit
      skill: true

commands:
  setup-docs:
    description: >-
      Scaffolds AGENTS.md, docs/ARCHITECTURE.md, docs/CONSTITUTION.md, and docs/feats/. Use when the user runs
      /setup-docs or asks to create the project's AI working-context docs.

opencode_config:
  model: opencode-go/glm-5.2
  small_model: opencode-go/deepseek-v4-flash
  default_agent: sddkit
  instructions:
    - AGENTS.md
