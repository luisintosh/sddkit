# Per-agent metadata. Model IDs live only under hosts.*.profiles.
# Agents declare profile; host blocks are adapters (mode, permission, skill).
#
# Permission maps: opencode applies the LAST matching pattern, so order is
# load-bearing — broad rules first, narrow exceptions last. Reordering a block
# silently changes what an agent may edit.

hosts:
  opencode:
    profiles:
      conduct: { id: opencode-go/qwen3.7-plus }
      think: { id: openai/gpt-5.6-sol }
      execute: { id: openai/gpt-5.6-luna }
      review: { id: opencode-go/kimi-k3 }
      critique: { id: opencode-go/kimi-k2.7-code }
      validate: { id: opencode-go/deepseek-v4-pro }
      write: { id: opencode-go/kimi-k3 }
  cursor:
    profiles:
      conduct: { id: inherit }
      think: { id: grok-4.6, effort: xhigh }
      execute: { id: grok-4.6, effort: high }
      review: { id: grok-4.6, effort: high }
      critique: { id: claude-sonnet-5, effort: high }
      validate: { id: grok-4.6, effort: medium }
      write: { id: grok-4.6, effort: medium }
  claude:
    profiles:
      conduct: { id: inherit }
      think: { id: opus, effort: medium }
      execute: { id: sonnet, effort: high }
      review: { id: sonnet, effort: high }
      critique: { id: opus, effort: high }
      validate: { id: sonnet, effort: medium }
      write: { id: sonnet, effort: medium }
  codex:
    profiles:
      conduct: { id: inherit }
      think: { id: gpt-5.6-terra, effort: xhigh }
      execute: { id: gpt-5.6-terra, effort: high }
      review: { id: gpt-5.6-terra, effort: high }
      critique: { id: gpt-5.6-sol, effort: high }
      validate: { id: gpt-5.6-terra, effort: high }
      write: { id: gpt-5.6-luna, effort: medium }

# Optional supervised dispatch. When `sddkit-state probe orchestrator` finds Orca
# plus the routed CLIs, the conductor starts each specialist as an Orca worker on
# the CLI/model below instead of the host's own subagent. `conduct` is absent:
# the conductor is never dispatched. Cursor ids carry their effort.
orchestrators:
  orca:
    profiles:
      think: { agent: claude, id: opus, effort: medium }
      critique: { agent: claude, id: sonnet, effort: high }
      review: { agent: claude, id: sonnet, effort: high }
      execute: { agent: cursor, id: grok-4.7-high }
      validate: { agent: cursor, id: grok-4.7-high }
      write: { agent: cursor, id: grok-4.7-high }

agents:
  sddkit:
    profile: conduct
    description: >-
      Drives the end-to-end spec-driven development (SDD) feature pipeline — sequences stages, manages human-in-the-loop
      gates, routes review findings, keeps docs in sync. Use when the user asks to implement a feature, run SDD, or
      resume/continue a pipeline. Treats a normal feature request as a request to run the full workflow. Not for product
      or roadmap planning (sddkit-epic) or one-line edits such as a typo or a version bump.
    opencode:
      mode: primary
      temperature: 0.2
      steps: 100
      permission:
        edit:
          "docs/feats/**/state.yaml": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
        # Merged over the global map, which denies "git reset --hard*"; the clean-tree escalation needs exactly this
        # one form.
        bash:
          "git reset --hard HEAD": allow
    cursor:
      skill: true

  sddkit-design:
    profile: think
    description: >-
      Writes the feature design in one pass — spec (the what & why), spec-derived acceptance contracts, and the
      implementation plan with cheapest-oracle journeys and waypoints. Use when the conductor delegates design, or when
      a spec, its @S<n> scenarios, or a plan must be written or revised.
    opencode:
      mode: subagent
      temperature: 0.3
      steps: 50
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
          "**/journal.ndjson": deny
        bash: allow
    cursor: {}
    # The conductor continues this agent after critique and design-gate edits, and those waits outlast Claude Code's
    # 5m subagent cache. 1h writes cost 2x, so set it only on agents that get continued.
    claude:
      cache_ttl: 1h

  sddkit-design-reviewer:
    profile: review
    description: >-
      Independent critique of a feature design (spec, contracts, plan) before its gate. Fixes unambiguous issues in
      place and reports the rest as structured findings. Use when the conductor delegates a design critique.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 30
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
          "**/journal.ndjson": deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor: {}

  sddkit-implementer:
    profile: execute
    description: >-
      Writes the planned failing journey oracle, then the implementation, in one pass. Never weakens tests. Use when the
      conductor delegates implementation, an escalation re-derive, or a targeted-test fix.
    opencode:
      mode: subagent
      temperature: 0.2
      steps: 60
      permission:
        edit:
          "*": allow
          # Frozen inputs: spec, plan, contracts. Cucumber e2e *.feature lives
          # outside docs/feats/** and stays writable.
          "docs/feats/**": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
    cursor: {}
    # The conductor continues this agent after each failed targeted test and in the review fix round; the test runs in
    # between outlast Claude Code's 5m subagent cache.
    claude:
      cache_ttl: 1h

  sddkit-code-reviewer:
    profile: critique
    description: >-
      Independent review of the feature implementation diff against its acceptance contracts. Fixes unambiguous
      blocker/major findings in place and reports the rest as structured findings. Use when the conductor delegates
      implementation review.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 40
      permission:
        edit:
          "*": allow
          # Frozen inputs, conductor-owned state, git internals, and host/agent config stay out of reach.
          "docs/feats/**": deny
          "**/journal.ndjson": deny
          ".git/**": deny
          ".agents/**": deny
          ".claude/**": deny
          ".codex/**": deny
          ".cursor/**": deny
          ".opencode/**": deny
        # Commands may run tests; git and tracker writes stay with the conductor.
        bash:
          "*": allow
          "git add*": deny
          "git rm*": deny
          "git mv*": deny
          "git restore*": deny
          "git update-index*": deny
          "git commit*": deny
          "git push*": deny
          "git reset*": deny
          "git checkout*": deny
          "git stash*": deny
          "gh *": deny
    cursor: {}

  sddkit-qa:
    profile: validate
    description: >-
      Validates the implementation against spec + acceptance contracts. Prefers the committed journey oracle;
      agent-browser only for uncovered UI e2e paths. Posts the evidence report as a PR comment. Use when the conductor
      delegates QA.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 60
      permission:
        edit:
          "*": deny
          "/tmp/**": allow
        bash: allow
    cursor: {}

  sddkit-docs-writer:
    profile: write
    description: >-
      Writes the human-facing docs a finished feature leaves behind — the owning domain's README, plus AGENTS.md and
      docs/ARCHITECTURE.md. Current state only, never a changelog. Use when the conductor delegates docs-sync.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 30
      permission:
        edit:
          "*": deny
          "AGENTS.md": allow
          "docs/**": allow
          "**/README.md": allow
          # Must stay last: the root README is the project's own and
          # docs/feats/** is the conductor's, and only the trailing position
          # keeps these denies ahead of the allows above.
          "README.md": deny
          "docs/feats/**": deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor: {}

  sddkit-epic:
    profile: think
    description: >-
      Product Owner planner. Refines a raw idea into a measurable goal, then writes a feature roadmap at
      docs/product/<slug>/roadmap.md. Use when the user asks to plan a product, write a roadmap, or turn an idea into
      sequenced features. Standalone — does not run the SDD pipeline.
    opencode:
      mode: primary
      temperature: 0.4
      steps: 80
      permission:
        edit:
          "*": deny
          "docs/product/**": allow
          "/tmp/**": allow
        bash:
          "*": ask
          "git status*": allow
          "git branch*": allow
          "git remote*": allow
          "git rev-parse*": allow
          "git log*": allow
          "git add docs/product*": allow
          "git commit*": allow
          "gh auth status*": allow
          "gh repo view*": allow
          "gh issue create*": allow
          "gh issue view*": allow
          "gh issue list*": allow
    cursor:
      skill: true

commands:
  sddkit-setup-docs:
    description: >-
      Scaffolds AGENTS.md, docs/ARCHITECTURE.md, docs/CONSTITUTION.md, and docs/feats/. Run by the user as
      /sddkit-setup-docs.

opencode_config:
  model: opencode-go/glm-5.2
  small_model: opencode-go/deepseek-v4-flash
  default_agent: sddkit
  instructions:
    - AGENTS.md
