# Per-agent metadata. Model IDs live only under hosts.*.profiles.
# Agents declare profile; host blocks are adapters (mode, permission, skill).
#
# Permission maps: opencode applies the LAST matching pattern, so order is
# load-bearing — broad rules first, narrow exceptions last. Reordering a block
# silently changes what an agent may edit.

hosts:
  opencode:
    profiles:
      conduct: { id: opencode-go/qwen3.7-plus }
      think: { id: openai/gpt-5.6-sol }
      execute: { id: openai/gpt-5.6-luna }
      review: { id: opencode-go/kimi-k3 }
      critique: { id: opencode-go/kimi-k2.7-code }
      validate: { id: opencode-go/deepseek-v4-pro }
      write: { id: opencode-go/kimi-k3 }
  cursor:
    profiles:
      conduct: { id: inherit }
      think: { id: grok-4.6, effort: xhigh }
      execute: { id: grok-4.6, effort: high }
      review: { id: grok-4.6, effort: high }
      critique: { id: claude-sonnet-5, effort: high }
      validate: { id: grok-4.6, effort: medium }
      write: { id: grok-4.6, effort: medium }
  claude:
    profiles:
      conduct: { id: inherit }
      think: { id: sonnet, effort: xhigh }
      execute: { id: sonnet, effort: high }
      review: { id: sonnet, effort: high }
      critique: { id: opus, effort: high }
      validate: { id: sonnet, effort: medium }
      write: { id: sonnet, effort: medium }
  codex:
    profiles:
      conduct: { id: inherit }
      think: { id: gpt-5.6-terra, effort: xhigh }
      execute: { id: gpt-5.6-terra, effort: high }
      review: { id: gpt-5.6-terra, effort: high }
      critique: { id: gpt-5.6-sol, effort: high }
      validate: { id: gpt-5.6-terra, effort: high }
      write: { id: gpt-5.6-luna, effort: medium }

agents:
  sddkit:
    profile: conduct
    description: >-
      Drives the end-to-end spec-driven development (SDD) feature pipeline — sequences stages, manages human-in-the-loop
      gates, routes review findings, keeps docs in sync. Use when the user asks to implement a feature, run SDD, or
      resume/continue a pipeline. Treats a normal feature request as a request to run the full workflow.
    opencode:
      mode: primary
      temperature: 0.2
      steps: 100
      permission:
        edit:
          "docs/feats/**/state.yaml": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
    cursor:
      skill: true

  sddkit-spec:
    profile: think
    description: >-
      Writes feature specifications (the what & why) and spec-derived acceptance contracts. Use when the conductor
      delegates specify/contracts, or when a spec or its @S<n> scenarios must be written or revised.
    opencode:
      mode: subagent
      temperature: 0.3
      steps: 20
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
        bash: deny
    cursor: {}

  sddkit-architect:
    profile: think
    description: >-
      Plans implementation strategy and writes feature plans (SDD plan stage). Owns codebase exploration and cheapest-
      oracle journeys. Use when the conductor delegates plan, or when a feature plan, its Test strategy, or
      Implementation waypoints must be written or revised.
    opencode:
      mode: subagent
      temperature: 0.3
      steps: 30
      permission:
        edit:
          "*": deny
          "docs/feats/**": allow
          "docs/feats/**/state.yaml": deny
        bash: allow
    cursor: {}

  sddkit-plan-reviewer:
    profile: review
    description: >-
      Independent, READ-ONLY critique of the spec or the plan before its gate. Emits structured spec/plan findings;
      never edits. Use when the conductor delegates a spec or plan critique.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 25
      permission:
        edit: deny
        write: deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor:
      readonly: true

  sddkit-implementer:
    profile: execute
    description: >-
      Writes the planned failing journey oracle, then the implementation, in one pass. Never weakens tests. Use when the
      conductor delegates implementation, an escalation re-derive, or a targeted-test fix.
    opencode:
      mode: subagent
      temperature: 0.2
      steps: 60
      permission:
        edit:
          "*": allow
          # Frozen inputs: spec, plan, contracts. Cucumber e2e *.feature lives
          # outside docs/feats/** and stays writable.
          "docs/feats/**": deny
          "**/journal.ndjson": deny
          ".opencode/**": deny
    cursor: {}

  sddkit-code-reviewer:
    profile: critique
    description: >-
      Independent, READ-ONLY review of the feature implementation diff against its acceptance contracts. Emits
      structured findings; never edits. Use when the conductor delegates implementation review.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 25
      permission:
        edit: deny
        write: deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor:
      readonly: true

  sddkit-qa:
    profile: validate
    description: >-
      Validates the implementation against spec + acceptance contracts. Prefers the committed journey oracle; Playwright
      only for uncovered UI e2e paths. Posts the evidence report as a PR comment. Use when the conductor delegates QA.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 60
      permission:
        edit:
          "*": deny
          "/tmp/**": allow
        bash: allow
    cursor: {}

  sddkit-docs-writer:
    profile: write
    description: >-
      Writes the human-facing docs a finished feature leaves behind — the owning domain's README, plus AGENTS.md and
      docs/ARCHITECTURE.md. Current state only, never a changelog. Use when the conductor delegates docs-sync.
    opencode:
      mode: subagent
      temperature: 0.1
      steps: 30
      permission:
        edit:
          "*": deny
          "AGENTS.md": allow
          "docs/**": allow
          "**/README.md": allow
          # Must stay last: the root README is the project's own and
          # docs/feats/** is the conductor's, and only the trailing position
          # keeps these denies ahead of the allows above.
          "README.md": deny
          "docs/feats/**": deny
        bash:
          "*": deny
          "git diff*": allow
          "git show*": allow
          "git log*": allow
          "git status*": allow
    cursor: {}

  sddkit-plan:
    profile: think
    description: >-
      Product Owner planner. Refines a raw idea into a measurable goal, then writes a feature roadmap at
      docs/product/<slug>/roadmap.md. Use when the user asks to plan a product, write a roadmap, or turn an idea into
      sequenced features. Standalone — does not run the SDD pipeline.
    opencode:
      mode: primary
      temperature: 0.4
      steps: 80
      permission:
        edit:
          "*": deny
          "docs/product/**": allow
          "/tmp/**": allow
        bash:
          "*": ask
          "git status*": allow
          "git branch*": allow
          "git remote*": allow
          "git rev-parse*": allow
          "git log*": allow
          "git add docs/product*": allow
          "git commit*": allow
          "gh auth status*": allow
          "gh repo view*": allow
          "gh issue create*": allow
          "gh issue view*": allow
          "gh issue list*": allow
    cursor:
      skill: true

commands:
  setup-docs:
    description: >-
      Scaffolds AGENTS.md, docs/ARCHITECTURE.md, docs/CONSTITUTION.md, and docs/feats/. Use when the user runs
      /setup-docs or asks to create the project's AI working-context docs.

opencode_config:
  model: opencode-go/glm-5.2
  small_model: opencode-go/deepseek-v4-flash
  default_agent: sddkit
  instructions:
    - AGENTS.md
